<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            html, body{
                background-color: #0f0f0f;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
            }
            h1{
                font-size: 2vw;
            }
            p{
                font-size: 1vw;
            }
            a:link, a:visited{
                color: inherit;
                text-decoration: none;
                border-bottom: 1px solid transparent;
            }
            a:hover, a:active{
                color: inherit;
                text-decoration: underline;
                cursor: pointer;
            }
            center{
                text-align: center;
            }
        </style>
        <title>ERROR</title>
    </head>
    <body>
        <center>
            <h1>ERROR</h1>
            <p>There was an error processing your request.</p>
        </center>
    </body>
</html>
